apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldtrack-backend
  labels:
    app: fieldtrack-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fieldtrack-backend
  template:
    metadata:
      labels:
        app: fieldtrack-backend
    spec:
      containers:
      - name: fieldtrack-backend
        image: fieldtrack-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: PORT
          value: "3000"
