# Nginx Configuration for FieldTrack
# Target: Ubuntu 24.04 / 22.04 LTS
# Deployment Paths:
#   API:     /etc/nginx/sites-available/fieldtrack-api.conf
#   Web App: /etc/nginx/sites-available/fieldtrack-web.conf
# Symlink to: /etc/nginx/sites-enabled/

# ─────────────────────────────────────────────────────────────────────────────
# REDIRECT HTTP → HTTPS
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fieldtrack.top www.fieldtrack.top;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# MAIN WEB APP  (https://fieldtrack.top)
# Serves Flutter Web build from /var/www/fieldtrack/frontend/build/web
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fieldtrack.top www.fieldtrack.top;

    # ── SSL (Let's Encrypt via Certbot) ───────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/fieldtrack.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldtrack.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript application/wasm;

    # ── Flutter Web Build Root ────────────────────────────────────────────
    root /var/www/fieldtrack/frontend/build/web;
    index index.html;

    # ── CRITICAL: Block sensitive files from being served ─────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # ── Firebase Service Worker (MUST be at web root, no caching) ─────────
    # Flutter build puts firebase-messaging-sw.js directly in build/web/
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── Flutter Service Worker & Manifest ────────────────────────────────
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Static assets (JS, CSS, WASM, images, fonts) – long-lived cache ──
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Flutter SPA fallback – all unknown paths → index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

