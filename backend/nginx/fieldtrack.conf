# Nginx Configuration Template for FieldTrack
# Target: Ubuntu 24.04 / 22.04 LTS
# Deployment Path: /etc/nginx/sites-available/fieldtrack.conf
# Symlink to: /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # REPLACE WITH YOUR DOMAIN OR IP

    # Redirect all HTTP requests to HTTPS
    # Uncomment after configuring Let's Encrypt SSL
    # return 301 https://$host$request_uri;

    # --- Remove this block if using HTTPS redirection above ---
    # Temporary fallback before SSL
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    # --------------------------------------------------------
}

