<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FieldTrack Developer Login</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
      body { margin: 0; background: #07111f; color: #f5f7fb; }
      .shell { max-width: 520px; margin: 64px auto; padding: 24px; }
      .card { background: #0f1b2c; border: 1px solid #22324a; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      .muted { color: #8ba0b7; font-size: 0.95rem; line-height: 1.5; }
      .credentials { background: #14253c; border: 1px solid #22324a; border-radius: 8px; padding: 12px; margin: 12px 0 16px; font-family: Consolas, monospace; font-size: 0.95rem; }
      input, button { width: 100%; border-radius: 8px; border: 1px solid #22324a; padding: 10px 12px; margin-bottom: 12px; background: #14253c; color: white; box-sizing: border-box; }
      button { cursor: pointer; background: #1b934f; border: none; font-weight: 600; }
      .error { color: #ff8f8f; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>Developer Dashboard Login</h1>
        <p class="muted">Sign in with the admin credentials configured in the backend environment.</p>
        <div class="credentials">
        </div>
        <form id="loginForm">
          <input id="emailInput" type="email" placeholder="Admin email" required />
          <input id="passwordInput" type="password" placeholder="Password" required />
          <button type="submit">Sign in</button>
        </form>
        <div id="status" class="muted">Enter the admin email and password from the backend.</div>
      </div>
    </div>

    <script>
      const AUTH_TOKEN_KEY = 'fieldtrack_developer_token';

      function setStatus(message, isError = false) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = isError ? 'error' : 'muted';
      }

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        setStatus('Signing in…');

        try {
          const response = await fetch('/api/v1/developer/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          let data = {};
          try {
            data = await response.json();
          } catch (_) {
            data = {};
          }

          if (!response.ok || !data.token) {
            throw new Error(data.error || data.message || `Sign-in failed with status ${response.status}`);
          }

          localStorage.setItem(AUTH_TOKEN_KEY, data.token);
          document.cookie = `${AUTH_TOKEN_KEY}=${encodeURIComponent(data.token)}; Path=/; Max-Age=1800; SameSite=Lax`;
          setStatus('Signed in. Redirecting to the dashboard...');
          window.location.href = '/developer-dashboard';
        } catch (error) {
          setStatus(error.message || 'Unable to sign in', true);
        }
      });

      if (localStorage.getItem(AUTH_TOKEN_KEY)) {
        window.location.href = '/developer-dashboard';
      }
    </script>
  </body>
</html>
